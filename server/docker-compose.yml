services:
  app:
    build: .
    image: habitflow:latest
    container_name: habitflow
    ports:
      - "8081:8080"
    volumes:
      - storage:/var/www/html/storage
    env_file:
      - .env.production
    networks:
      - default
      - shared-db
    restart: unless-stopped

  # Tahap 31B: proses antrean untuk email kode (verifikasi dan lupa kata sandi). Image dan env
  # sama dengan app; tanpa ini email tertahan di tabel jobs dan tidak pernah terkirim.
  queue:
    image: habitflow:latest
    container_name: habitflow-queue
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    # Image dasar memeriksa curl localhost:8080, padahal worker tidak menjalankan web server,
    # jadi container ini selalu tampil unhealthy walau prosesnya berjalan. Pemeriksaan dimatikan.
    healthcheck:
      disable: true
    volumes:
      - storage:/var/www/html/storage
    env_file:
      - .env.production
    networks:
      - default
      - shared-db
    restart: unless-stopped

networks:
  shared-db:
    external: true

volumes:
  storage:
